plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.routelinknative'
version = '0.1.0'

android {
  namespace "expo.modules.routelinknative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Same version React Native 0.86 ships, so the app resolves a single OkHttp.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
