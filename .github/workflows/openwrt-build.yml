name: OpenWrt packages

# Reusable: builds routelinkd + luci-app-routelink for every release/arch and uploads one artifact each
# (pkg-<release>-<arch>), plus ipk packages of 25.12 for forks that kept opkg, such as Kwrt
# (pkg-<release>-<arch>-ipk). With sign, apk packages are signed and feed indexes are generated and signed.
on:
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
    secrets:
      OPENWRT_USIGN_KEY:
        required: false
      OPENWRT_APK_KEY:
        required: false

jobs:
  build:
    name: ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['23.05.6', '24.10.8', '25.12.5']
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mipsel_24kc
          - mips_24kc
    steps:
      - uses: actions/checkout@v7
      - name: Build
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.release }}
          FEEDNAME: routelink
          FEED_DIR: ${{ github.workspace }}/openwrt
          PACKAGES: routelinkd luci-app-routelink
          NO_REFRESH_CHECK: true
          # the SDK image has no shfmt and openwrt/ is not a git root; openwrt.yml checks the init script
          NO_SHFMT_CHECK: true
          # opkg feeds (23.05, 24.10): the SDK writes and usign-signs the index. apk (25.12+) is done below:
          # the SDK does not sign packages, and re-signing them afterwards would invalidate its index.
          INDEX: ${{ inputs.sign && !startsWith(matrix.release, '25.') && '1' || '0' }}
          KEY_BUILD: ${{ inputs.sign && secrets.OPENWRT_USIGN_KEY || '' }}
      - name: Sign apk packages and index
        if: inputs.sign && startsWith(matrix.release, '25.')
        env:
          APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}
          SDK: openwrt/sdk:${{ matrix.arch }}-${{ matrix.release }}
          PKGS: ${{ github.workspace }}/bin/packages/${{ matrix.arch }}/routelink
        run: |
          # local installs need signed packages (apk refuses unsigned files and LuCI's helper cannot pass
          # --allow-untrusted); adbsign takes one file per call
          docker run --rm --user root -e APK_KEY -v "$PKGS:/pkgs" "$SDK" bash -c '
            set -e
            umask 077
            printf "%s\n" "$APK_KEY" > /tmp/key.pem
            apk=/builder/staging_dir/host/bin/apk
            cd /pkgs
            rm -f packages.adb
            for f in *.apk; do
              "$apk" adbsign --allow-untrusted --reset-signatures --sign-key /tmp/key.pem "$f"
            done
            "$apk" mkndx --allow-untrusted --sign-key /tmp/key.pem --output packages.adb *.apk
            rm -f /tmp/key.pem'
      - name: Store packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.release }}-${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/routelink/
          if-no-files-found: error

  # Kwrt 25.12 kept opkg; its libraries have the same ABI versions as OpenWrt 25.12, so the 24.10
  # packages do not fit (they need libubox20240329). The SDK hides USE_APK and gh-action-sdk cannot
  # change the build's make variables, so this goes through scripts/agent-build.sh.
  build-ipk:
    name: ${{ matrix.release }} ${{ matrix.arch }} ipk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['25.12.5']
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mipsel_24kc
          - mips_24kc
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          INDEX: 1
          # opkg does not check local packages; the feed index is usign-signed like 23.05 and 24.10
          USIGN_KEY: ${{ inputs.sign && secrets.OPENWRT_USIGN_KEY || '' }}
        run: scripts/agent-build.sh ${{ matrix.release }} ${{ matrix.arch }} ipk
      - name: Store packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.release }}-${{ matrix.arch }}-ipk
          path: openwrt/out/${{ matrix.release }}/${{ matrix.arch }}-ipk/
          if-no-files-found: error
