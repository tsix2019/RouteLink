name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'test/integration/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/integration.yml'
      # The router plugin has its own workflow (openwrt.yml)
      - 'openwrt/**'
      - 'test/agent/**'
      - 'scripts/agent-*'
      - 'scripts/lab-*'
      - 'scripts/pm-*'
      - 'scripts/luci-*'
      - 'scripts/traffic-lab.sh'
      - 'jest.agent.config.js'
      - '.github/workflows/openwrt*.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Toolchain
        run: xcodebuild -version && xcrun simctl list runtimes | grep -i ios
      - name: Prebuild
        run: npx expo prebuild -p ios --no-install
      - name: CocoaPods
        run: cd ios && pod install
      - name: Build (simulator, Release, self-test enabled)
        env:
          EXPO_PUBLIC_SELFTEST: '1'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/RouteLink.xcworkspace -scheme RouteLink -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: .*RouteLinkNative|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphonesimulator/RouteLink.app
      - name: Boot simulator
        id: sim
        run: echo "udid=$(scripts/ci/ios-sim.sh)" >> "$GITHUB_OUTPUT"
      - name: Native self-test
        run: scripts/ci/ios-selftest.sh build/Build/Products/Release-iphonesimulator/RouteLink.app "${{ steps.sim.outputs.udid }}"
      - name: Screenshots (demo mode)
        # Also when the self-test failed: the screenshots don't depend on it.
        if: always() && steps.sim.outcome == 'success'
        run: scripts/ci/ios-screenshots.sh "${{ steps.sim.outputs.udid }}"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: |
            docs/screenshots/**/ios-*.png
            ${{ runner.temp }}/selftest/selftest-report.json
            ${{ runner.temp }}/selftest/selftest.png
          if-no-files-found: ignore
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-log
          path: build.log

  # Tags only: an unsigned device build for people who sign it themselves (AltStore, Sideloadly, Xcode).
  release-ipa:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild -p ios --no-install
      - run: cd ios && pod install
      - name: Archive (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/RouteLink.xcworkspace -scheme RouteLink -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/RouteLink.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee archive.log \
            | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d build/RouteLink.xcarchive/Products/Applications/RouteLink.app
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/RouteLink.xcarchive/Products/Applications/RouteLink.app Payload/
          zip -qry RouteLink-unsigned.ipa Payload
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --notes "See README." || true
          gh release upload "$GITHUB_REF_NAME" RouteLink-unsigned.ipa --clobber
      - name: Upload archive log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive-log
          path: archive.log
