name: OpenWrt release

# Tag agent-vX.Y.Z (or agent-vX.Y.Z-rc.N for a pre-release) on a commit that passed openwrt.yml.
# Needs the repository secrets OPENWRT_USIGN_KEY and OPENWRT_APK_KEY, and GitHub Pages set to
# "GitHub Actions". Pre-releases get a GitHub release but do not replace the feed on Pages.
on:
  push:
    tags: ['agent-v*']

concurrency:
  group: openwrt-release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/openwrt-build.yml
    with:
      sign: true
    secrets:
      OPENWRT_USIGN_KEY: ${{ secrets.OPENWRT_USIGN_KEY }}
      OPENWRT_APK_KEY: ${{ secrets.OPENWRT_APK_KEY }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: artifacts
      - name: Assemble release and feed
        run: npx tsx scripts/agent-manifest.ts artifacts "$GITHUB_REF_NAME" release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/assets/* $pre \
            --title "RouteLink router plugin ${GITHUB_REF_NAME#agent-v}" \
            --notes-file openwrt/RELEASE_NOTES.md
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          path: release/pages
      - uses: actions/deploy-pages@v5
        if: ${{ !contains(github.ref_name, '-') }}
